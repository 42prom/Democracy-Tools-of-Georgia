name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-test:
    name: Backend Build & Test (PR)
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://DTG_user:DTG_test_password@localhost:5432/DTG_test
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: test_secret_key_for_ci
      NODE_ENV: test
      BIOMETRIC_MOCK_MODE: true
      NULLIFIER_SECRET: ci-test-nullifier-secret-not-for-production
      CRYPTO_HASHER: hmac
      RECEIPT_PRIVATE_KEY_PEM: ""
      RECEIPT_PUBLIC_KEY_PEM: ""

    services:
      postgres:
        image: postgres:15-alpine@sha256:fe0737ba566a2c5b2a28f34433c0a423261900ec17b9bf7ad115e1aae7e57f1b
        env:
          POSTGRES_DB: DTG_test
          POSTGRES_USER: DTG_user
          POSTGRES_PASSWORD: DTG_test_password
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U DTG_user -d DTG_test" --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
        ports: [6379:6379]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        working-directory: ./backend
        run: npm ci --ignore-scripts
      - name: Audit runtime dependencies
        working-directory: ./backend
        run: npm audit --omit=dev --audit-level=high
      - name: Run linter
        working-directory: ./backend
        run: npm run lint
      - name: Run TypeScript check
        working-directory: ./backend
        run: npx tsc --noEmit
      - name: Run migrations
        working-directory: ./backend
        run: npm run migrate
      - name: Run tests
        working-directory: ./backend
        run: npm test
      - name: Run PostgreSQL and Redis integration tests
        working-directory: ./backend
        run: npm run test:integration
      - name: Build
        working-directory: ./backend
        run: npm run build

  contract-validation:
    name: OpenAPI Contract Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        working-directory: ./backend
        run: npm ci --ignore-scripts
      - name: Validate OpenAPI contracts
        working-directory: ./backend
        run: npm run validate:contracts

  mobile-static-and-unit:
    name: Flutter Static & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Flutter 3.44.0
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: "3.44.0"
          channel: stable
          cache: true
      - name: Install Flutter dependencies
        working-directory: ./mobile
        run: flutter pub get
      - name: Analyze mobile source and tests
        working-directory: ./mobile
        run: dart analyze lib test integration_test
      - name: Run Flutter unit and widget tests
        working-directory: ./mobile
        run: flutter test --reporter expanded

  mobile-android-integration:
    name: Android API 36 Integration
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [mobile-static-and-unit]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Setup Flutter 3.44.0
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: "3.44.0"
          channel: stable
          cache: true
      - name: Install Flutter dependencies
        working-directory: ./mobile
        run: flutter pub get
      - name: Enable KVM for the CI runner
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle
          sudo chmod a+rw /dev/kvm
          ls -l /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
      - name: Run Android host and platform-channel tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-port: 5582
          disk-size: 4096M
          disable-animations: true
          script: cd mobile && flutter test integration_test/app_smoke_test.dart -d emulator-5582 --reporter expanded

  mobile-ios-simulator:
    name: iOS Simulator Build & Integration
    # MLKitVision 10 / MLKitCommon 14 ship x86_64 simulator binaries only.
    # Use Intel + iOS 18.6 until these dependencies support ARM64 simulators.
    runs-on: macos-15-intel
    env:
      IOS_SIMULATOR_RUNTIME: com.apple.CoreSimulator.SimRuntime.iOS-18-6
    timeout-minutes: 45
    needs: [mobile-static-and-unit]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Flutter 3.44.0
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: "3.44.0"
          channel: stable
          cache: true
      - name: Install Flutter dependencies
        working-directory: ./mobile
        run: flutter pub get
      - name: Build unsigned iOS Simulator app
        working-directory: ./mobile
        shell: bash
        run: |
          set -o pipefail
          flutter build ios --simulator --no-codesign --verbose 2>&1 | tee "$RUNNER_TEMP/ios-build.log"
      - name: Preserve iOS build diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ios-build-diagnostics
          path: ${{ runner.temp }}/ios-build.log
          retention-days: 7
      - name: Run the shared integration contract on iOS
        working-directory: ./mobile
        shell: bash
        run: |
          SIMULATOR_ID="$(xcrun simctl list devices available -j | python3 -c '
          import json, os, sys
          data = json.load(sys.stdin)["devices"]
          runtime = os.environ["IOS_SIMULATOR_RUNTIME"]
          for device in data.get(runtime, []):
              if device.get("isAvailable") and device["name"].startswith("iPhone"):
                  print(device["udid"])
                  raise SystemExit(0)
          raise SystemExit(f"No available iPhone Simulator found for {runtime}")
          ')"
          xcrun simctl boot "$SIMULATOR_ID" || true
          xcrun simctl bootstatus "$SIMULATOR_ID" -b
          flutter test integration_test/app_smoke_test.dart -d "$SIMULATOR_ID" --reporter expanded

  admin-build:
    name: Admin Dashboard Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: admin/package-lock.json
      - name: Install dependencies
        working-directory: ./admin
        run: npm ci --ignore-scripts
      - name: Audit runtime dependencies
        working-directory: ./admin
        run: npm audit --omit=dev --audit-level=high
      - name: Run linter
        working-directory: ./admin
        run: npm run lint
      - name: Run TypeScript check
        working-directory: ./admin
        run: npx tsc --noEmit
      - name: Run admin tests
        working-directory: ./admin
        run: npm test
      - name: Build
        working-directory: ./admin
        run: npm run build

  container-security:
    name: Container Reproducibility & Runtime Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate Compose configuration
        run: docker compose --env-file .env.example config --quiet
      - name: Validate Dockerfiles
        run: |
          docker build --check -f backend/Dockerfile backend
          docker build --check -f admin/Dockerfile admin
          docker build --check -f dtg-shield-service/Dockerfile dtg-shield-service
          docker build --check -f biometric-service/Dockerfile biometric-service
      - name: Build backend and verify native runtime
        run: |
          docker build -t dtg-backend-ci backend
          docker run --rm --entrypoint node dtg-backend-ci -e "const bcrypt=require('bcrypt');const hash=bcrypt.hashSync('ci',4);if(!bcrypt.compareSync('ci',hash))process.exit(1)"
      - name: Build admin and validate Nginx
        run: |
          docker build -t dtg-admin-ci admin
          docker run --rm dtg-admin-ci nginx -t
      - name: Build Shield and run security tests
        run: |
          docker build -t dtg-shield-ci dtg-shield-service
          docker run --rm --entrypoint python dtg-shield-ci -m pip check
          docker run --rm --entrypoint python dtg-shield-ci -m unittest discover -s tests -v
      - name: Build biometric runtime and validate dependencies
        run: |
          docker build -t dtg-biometric-ci biometric-service
          docker run --rm --entrypoint python dtg-biometric-ci -m pip check
